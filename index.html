<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4f4f4; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  .bar { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; background: rgba(255,255,255,.9); font-size: 14px; z-index: 1; }
</style>
</head>
<body>
<div class="bar">Pressed Roots – Washington, DC – PO#PR101 &nbsp;·&nbsp; drag to rotate, scroll to zoom, right-drag to pan</div>
<model-viewer src="models/pressed-roots-dc-PR101.glb" alt="Pressed Roots Washington DC 3D drawing"
  camera-controls auto-rotate shadow-intensity="1" exposure="1" environment-image="neutral"></model-viewer>
</body>
</html>
